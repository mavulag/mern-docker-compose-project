version: "3"
services:
  react-app:
    build: ./client
    stdin_open: true
    ports: 
      - "5173:5173"
    networks:
      - mern-app
    command: ["npm", "run", "dev"] # Ensure the command runs "dev" script
    depends_on:
      - api-server
  api-server:
    build: ./server
    ports: 
      - "5000:5000"
    networks:
      - mern-app
    depends_on:
      - mongo
  mongo:
    image: mongo:3.6.19-xenial
    ports: 
      - "27018:27017"
    networks:
      - mern-app
    volumes: 
      - mongo-data:/data/db
networks:
  mern-app:
    driver: bridge
volumes:
  mongo-data:
    driver: local
